<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .outro-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .outro-text {
            font-size: 3rem;
            color: var(--text-primary);
            max-width: 800px;
            line-height: 1.5;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div id="bg-container">
        <div class="glow-blob one"></div>
        <div class="glow-blob two"></div>
    </div>
    
    <canvas id="particles"></canvas>
    <div class="cursor-glow"></div>

    <div class="outro-container">
        <h1 class="outro-text playfair" id="outro-text"></h1>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const outroText = document.getElementById("outro-text");
            outroText.innerHTML = CONFIG.page6.outroText;

            // Fade in text
            gsap.to(outroText, { opacity: 1, y: -20, duration: 3, ease: "power2.out", delay: 1 });

            // Confetti effect
            setTimeout(() => {
                const duration = 5 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }, 1500);

            // Fade out everything after 12 seconds
            setTimeout(() => {
                gsap.to(outroText, { opacity: 0, duration: 4, ease: "power2.inOut" });
                
                // Fade out music if playing
                let globalAudio = document.getElementById("global-audio");
                if (globalAudio) {
                    gsap.to(globalAudio, { volume: 0, duration: 4, onComplete: () => {
                        globalAudio.pause();
                        sessionStorage.removeItem("musicPlaying");
                    }});
                }
            }, 12000);
        });
    </script>
</body>
</html>
