<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .split-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            width: 100%;
            opacity: 0;
        }

        .text-container {
            max-width: 400px;
            text-align: left;
        }

        .calendar-text {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }
            .text-container {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="bg-container">
        <div class="glow-blob one"></div>
        <div class="glow-blob two"></div>
    </div>
    
    <canvas id="particles"></canvas>

    <div class="container">
        <div class="split-layout" id="main-content">
            <div class="photo-frame" id="calendar-frame">
                <img src="" id="calendar-photo" alt="Calendar">
            </div>
            <div class="text-container">
                <div class="calendar-text playfair" id="calendar-text"></div>
                <button class="btn" id="btn-next">Next ➔</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("calendar-photo").src = CONFIG.page3.calendarPhoto;
            document.getElementById("calendar-text").innerHTML = CONFIG.page3.calendarText;

            // Premium Staggered Entrance
            const tl = gsap.timeline({defaults: {ease: "power3.out"}});
            
            tl.to(".split-layout", {opacity: 1, duration: 1})
              .fromTo("#calendar-frame", 
                {opacity: 0, x: -50, rotate: -10}, 
                {opacity: 1, x: 0, rotate: -3, duration: 1.2}, "-=0.5")
              .fromTo(".text-container", 
                {opacity: 0, x: 50}, 
                {opacity: 1, x: 0, duration: 1.2}, "-=1");

            document.getElementById("btn-next").addEventListener("click", () => {
                gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                    window.location.href = "page4.html";
                }});
            });
        });
    </script>
</body>
</html>
