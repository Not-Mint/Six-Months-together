<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-container {
            width: 100%;
            padding: 4rem 0;
            display: flex;
            flex-direction: column;
            gap: 15vh;
        }

        .gallery-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            width: 100%;
            opacity: 0;
        }

        .gallery-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .gallery-photo {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border-radius: 4px;
            transition: transform 0.5s;
        }

        .gallery-item:nth-child(odd) .gallery-photo {
            transform: rotate(3deg);
        }

        .gallery-item:nth-child(even) .gallery-photo {
            transform: rotate(-3deg);
        }

        .gallery-photo:hover {
            transform: rotate(0deg) scale(1.05) !important;
            box-shadow: 0 25px 45px rgba(255, 143, 177, 0.2);
            z-index: 10;
        }

        .gallery-photo img {
            width: 100%;
            border-radius: 2px;
            display: block;
        }

        .gallery-text {
            max-width: 350px;
            font-size: 1.4rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .end-section {
            display: flex;
            justify-content: center;
            padding: 10vh 0;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .gallery-item, .gallery-item:nth-child(even) {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="bg-container">
        <div class="glow-blob one"></div>
        <div class="glow-blob two"></div>
    </div>
    
    <canvas id="particles"></canvas>
    <div class="cursor-glow"></div>

    <div class="container" style="display: block;">
        <div class="gallery-container" id="gallery-container">
            <!-- Dynamically populated from config.js -->
        </div>

        <div class="end-section" id="end-section">
            <button class="btn" id="btn-finish">Continue ➔</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);
            
            const container = document.getElementById("gallery-container");
            
            CONFIG.page5.photos.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "gallery-item";
                div.innerHTML = `
                    <div class="gallery-photo">
                        <img src="${item.image}" alt="Memory ${index+1}">
                    </div>
                    <div class="gallery-text playfair">${item.text}</div>
                `;
                container.appendChild(div);
            });

            // Scroll Animations
            const items = document.querySelectorAll(".gallery-item");
            items.forEach((item, i) => {
                gsap.fromTo(item, 
                    { opacity: 0, y: 100 },
                    { 
                        opacity: 1, 
                        y: 0, 
                        duration: 1.5, 
                        ease: "power3.out",
                        scrollTrigger: {
                            trigger: item,
                            start: "top 80%",
                            end: "bottom 20%",
                            toggleActions: "play none none reverse"
                        }
                    }
                );
            });

            gsap.fromTo("#end-section", 
                { opacity: 0, scale: 0.8 },
                {
                    opacity: 1, scale: 1, duration: 1,
                    scrollTrigger: {
                        trigger: "#end-section",
                        start: "top 90%"
                    }
                }
            );

            document.getElementById("btn-finish").addEventListener("click", () => {
                gsap.to("body", { opacity: 0, duration: 1, onComplete: () => {
                    window.location.href = "page6.html";
                }});
            });
        });
    </script>
</body>
</html>
